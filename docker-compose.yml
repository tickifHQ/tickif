name: tickif

services:
  postgres:
    image: postgres:16-alpine
    container_name: tickif-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tickif}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tickif}
      POSTGRES_DB: ${POSTGRES_DB:-tickif}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tickif}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tickif-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  typesense:
    image: typesense/typesense:30.2
    container_name: tickif-typesense
    restart: unless-stopped
    command: >-
      --data-dir /data
      --api-key=${TYPESENSE_API_KEY:-tickif-local-typesense-key}
    ports:
      - "${TYPESENSE_PORT:-8108}:8108"
    volumes:
      - typesense_data:/data

  # Local S3-compatible store standing in for Cloudflare R2. Point R2_ENDPOINT at
  # http://localhost:9000 and create the R2_BUCKET via the console (:9001) or mc.
  minio:
    image: minio/minio:latest
    container_name: tickif-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${R2_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${R2_SECRET_ACCESS_KEY:-minioadmin}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  typesense_data:
  minio_data:
