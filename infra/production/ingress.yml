# Merge only after origin TLS and Cloudflare setup are reviewed.
services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    environment:
      ALLOW_START: '0'
      ALLOW_STOP: '0'
      ALLOW_RESTARTS: '0'
      AUTH: '0'
      BUILD: '0'
      COMMIT: '0'
      CONFIGS: '0'
      CONTAINERS: '0'
      DISTRIBUTION: '0'
      EVENTS: '1'
      EXEC: '0'
      IMAGES: '0'
      INFO: '1'
      NETWORKS: '1'
      NODES: '1'
      PING: '1'
      PLUGINS: '0'
      POST: '0'
      SECRETS: '0'
      SERVICES: '1'
      SESSION: '0'
      SWARM: '1'
      SYSTEM: '0'
      TASKS: '1'
      VERSION: '1'
      VOLUMES: '0'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - type: tmpfs
        target: /run
      - type: tmpfs
        target: /tmp
      - type: tmpfs
        target: /var/lib/haproxy
    networks:
      - socket_proxy
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:2375/_ping
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
        labels: tickif.telemetry.service
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 1m
      resources:
        reservations:
          cpus: '0.10'
          memory: 32M
        limits:
          cpus: '0.50'
          memory: 128M
  traefik:
    labels:
      tickif.telemetry.service: tickif-traefik
    image: traefik:v3.7.1@sha256:6b9cbca6fac42ab0075f5437d8dc1685cfd188626d8d515839ea94f8b6271c42
    command:
      - --configFile=/etc/traefik/static.yml
    configs:
      - source: traefik_static
        target: /etc/traefik/static.yml
        mode: 292
      - source: traefik_dynamic
        target: /etc/traefik/dynamic.yml
        mode: 292
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - type: tmpfs
        target: /tmp
    networks:
      - edge
      - socket_proxy
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - traefik
        - healthcheck
        - --ping
        - --configFile=/etc/traefik/static.yml
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
        labels: tickif.telemetry.service
    deploy:
      replicas: ${TRAEFIK_REPLICAS:-0}
      placement:
        constraints:
          - node.labels.tickif.traefik == true
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        failure_action: rollback
        monitor: 30s
        order: stop-first
      rollback_config:
        parallelism: 1
        monitor: 30s
        order: stop-first
      resources:
        reservations:
          cpus: '0.25'
          memory: 128M
        limits:
          cpus: '1.00'
          memory: 512M
    secrets:
      - source: origin_cert
        target: origin_cert.pem
      - source: origin_key
        target: origin_key.pem
  web:
    deploy:
      labels:
        - traefik.enable=true
        - traefik.swarm.network=tickif_production_edge
        - traefik.http.routers.tickif-web.rule=Host(`${PRODUCTION_HOST}`)
        - traefik.http.routers.tickif-web.entrypoints=websecure
        - traefik.http.routers.tickif-web.tls=true
        - traefik.http.routers.tickif-web.priority=10
        - traefik.http.routers.tickif-web.middlewares=secure-headers@file
        - traefik.http.services.tickif-web.loadbalancer.server.port=3000
        - traefik.http.services.tickif-web.loadbalancer.serverstransport=production-default@file
  api:
    deploy:
      labels:
        - traefik.enable=true
        - traefik.swarm.network=tickif_production_edge
        - traefik.http.routers.tickif-api.rule=Host(`${PRODUCTION_HOST}`) && (PathPrefix(`/api`)
          || Path(`/docs`) || Path(`/openapi.json`) || Path(`/health`) || Path(`/livez`)
          || Path(`/readyz`))
        - traefik.http.routers.tickif-api.entrypoints=websecure
        - traefik.http.routers.tickif-api.tls=true
        - traefik.http.routers.tickif-api.priority=200
        - traefik.http.routers.tickif-api.middlewares=secure-headers@file
        - traefik.http.services.tickif-api.loadbalancer.server.port=3001
        - traefik.http.services.tickif-api.loadbalancer.serverstransport=production-default@file
networks:
  socket_proxy:
    name: tickif_production_socket_proxy
    driver: overlay
    driver_opts:
      encrypted: 'true'
    internal: true
configs:
  traefik_static:
    external: true
    name: ${TRAEFIK_STATIC_CONFIG}
  traefik_dynamic:
    external: true
    name: ${TRAEFIK_DYNAMIC_CONFIG}
secrets:
  origin_cert:
    external: true
    name: ${ORIGIN_CERT_SECRET}
  origin_key:
    external: true
    name: ${ORIGIN_KEY_SECRET}
