http:
  middlewares:
    secure-headers:
      headers:
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: strict-origin-when-cross-origin
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        permissionsPolicy: 'camera=(), microphone=(), geolocation=(self)'
  serversTransports:
    production-default:
      forwardingTimeouts:
        dialTimeout: 5s
        responseHeaderTimeout: 30s
        idleConnTimeout: 90s

tls:
  certificates:
    - certFile: /run/secrets/origin_cert.pem
      keyFile: /run/secrets/origin_key.pem
  options:
    default:
      minVersion: VersionTLS12
      sniStrict: true
