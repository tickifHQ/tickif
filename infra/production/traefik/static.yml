api:
  dashboard: false
  insecure: false

ping:
  entryPoint: ping

entryPoints:
  web:
    address: ':80'
    forwardedHeaders:
      insecure: false
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ':443'
    # Preserve visitor addresses only from Cloudflare, never arbitrary peers.
    # Source: https://www.cloudflare.com/ips/ (reviewed 2026-11-23).
    forwardedHeaders:
      insecure: false
      trustedIPs:
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22
        - 2400:cb00::/32
        - 2606:4700::/32
        - 2803:f800::/32
        - 2405:b500::/32
        - 2405:8100::/32
        - 2a06:98c0::/29
        - 2c0f:f248::/32
  ping:
    address: ':8082'
  metrics:
    address: ':8083'

metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addServicesLabels: true
    addRoutersLabels: false

providers:
  swarm:
    endpoint: http://socket-proxy:2375
    exposedByDefault: false
    network: tickif_production_edge
    watch: true
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

log:
  level: INFO
  format: json

accessLog:
  format: json
  fields:
    defaultMode: keep
    names:
      ClientUsername: drop
      ClientAddr: drop
      ClientHost: drop
      RequestPath: drop
      RequestAddr: drop
      RequestHost: drop
    headers:
      defaultMode: drop
      names:
        User-Agent: drop
        Referer: drop
        Authorization: redact
        Cookie: redact
        Set-Cookie: redact
        X-Api-Key: redact
        X-Forwarded-For: redact
