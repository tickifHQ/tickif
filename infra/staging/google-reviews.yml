# deploy.sh includes this overlay only when GOOGLE_PLACES_API_KEY_SECRET is set.
# Google OAuth credentials do not authorize Google Places review fetching.
version: '3.13'
services:
  api:
    environment:
      GOOGLE_PLACES_API_KEY_FILE: /run/secrets/google_places_api_key
    secrets:
      - google_places_api_key
  worker:
    environment:
      GOOGLE_PLACES_API_KEY_FILE: /run/secrets/google_places_api_key
    secrets:
      - google_places_api_key
secrets:
  google_places_api_key:
    external: true
    name: ${GOOGLE_PLACES_API_KEY_SECRET}
