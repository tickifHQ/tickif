services:
  docker-proxy:
    image: haproxy:3.2.12-alpine@sha256:15ef8657ec12e7b19d5b6b6b6fcf6839a0e3cdae85d275be6c867e8a2690f33f
    user: '0:0'
    configs:
      - source: docker_proxy
        target: /usr/local/etc/haproxy/haproxy.cfg
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker_observation]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager, node.platform.os == linux]
      restart_policy: { condition: on-failure, delay: 5s }
      resources:
        reservations: { cpus: '0.05', memory: 16M }
        limits: { cpus: '0.25', memory: 64M }

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.148.0@sha256:8164eab2e6bca9c9b0837a8d2f118a6618489008a839db7f9d6510e66be3923c
    command: ['--config=/etc/otelcol-contrib/config.yml']
    user: '0:0'
    environment:
      SIGNOZ_OTLP_ENDPOINT: ${SIGNOZ_OTLP_ENDPOINT}
      TELEMETRY_HOST_NAME: '{{.Node.Hostname}}'
      TELEMETRY_HOST_ID: '{{.Node.ID}}'
      DEPLOYMENT_ENV: staging
      GOMEMLIMIT: 400MiB
    configs:
      - source: collector
        target: /etc/otelcol-contrib/config.yml
    secrets:
      - source: signoz_ingestion_key
        target: signoz_ingestion_key
    volumes:
      - /:/hostfs:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ${TELEMETRY_STORAGE_PATH:-/var/lib/docker/tickif-telemetry}:/var/lib/otelcol
    networks:
      telemetry:
        aliases: [otel-collector]
      docker_observation: {}
      backend: {}
      edge: {}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    deploy:
      mode: global
      placement:
        constraints: [node.role == manager, node.platform.os == linux]
      restart_policy: { condition: on-failure, delay: 5s }
      update_config: { parallelism: 1, order: stop-first, failure_action: rollback }
      resources:
        reservations: { cpus: '0.10', memory: 128M }
        limits: { cpus: '0.50', memory: 512M }

networks:
  telemetry:
    external: true
    name: tickif_telemetry
  backend:
    external: true
    name: tickif_backend
  edge:
    external: true
    name: tickif_edge
  docker_observation:
    driver: overlay
    internal: true
    driver_opts: { encrypted: 'true' }

configs:
  collector:
    external: true
    name: ${OTEL_COLLECTOR_CONFIG}
  docker_proxy:
    external: true
    name: ${TELEMETRY_DOCKER_PROXY_CONFIG}
secrets:
  signoz_ingestion_key:
    external: true
    name: ${SIGNOZ_INGESTION_KEY_SECRET}
