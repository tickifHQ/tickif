global
    maxconn 128
    log stdout format raw local0 warning

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

# The read-only socket mount does not restrict HTTP methods. These ACLs do.
# docker_stats needs container inspect (including environment metadata).
# It never promotes environment values; logs/archive/exec/Swarm admin are denied.
frontend docker_read
    bind :2375
    acl read_method method GET
    acl ping_method method HEAD
    acl ping_path path_reg ^(/v[0-9]+\.[0-9]+)?/_ping$
    acl permitted_path path_reg ^(/v[0-9]+\.[0-9]+)?/(_ping|version|info|containers/json|containers/[a-f0-9]{12,64}/(stats|json))$
    http-request allow if ping_method ping_path
    http-request deny deny_status 403 unless read_method permitted_path
    default_backend docker_engine

backend docker_engine
    server engine /var/run/docker.sock
