packages:
  - 'apps/*'
  - 'packages/*'
  - 'e2e'

# pnpm 10.9+ reads `overrides` / `onlyBuiltDependencies` from here, not the
# package.json `pnpm` field (which newer pnpm silently ignores).
overrides:
  esbuild: 0.28.1
  hono: ^4.12.27
  # Security patches for transitive advisories (pnpm audit, high severity).
  # brace-expansion DoS: GHSA-v6h2-p8h4-qcjw, then GHSA-mh99-v99m-4gvg which is
  # scoped <=5.0.7 and so covers the old 1.x pin too. One line for every copy —
  # eslint's minimatch@3 works fine on 5.x, so the split pins are no longer needed.
  brace-expansion: 5.0.8
  # js-yaml prototype pollution: keep within the 4.x line.
  'js-yaml@<4.3.0': 4.3.0
  # fast-uri ReDoS (via shadcn>@modelcontextprotocol/sdk>ajv): stay on 3.x.
  'fast-uri@<3.1.4': 3.1.4
  # sharp (GHSA-f88m-g3jw-g9cj): patch every copy, incl. next's bundled sharp.
  sharp: ^0.35.3
  # postcss sourceMappingURL file disclosure (GHSA-6g55-p6wh-862q <=8.5.11,
  # GHSA-r28c-9q8g-f849 <=8.5.17): patch every copy, via next and via tsup.
  postcss: ^8.5.18

onlyBuiltDependencies:
  - msw
  - sharp

# Centralized dependency versions (pnpm catalog).
# Reference in package.json as "catalog:".
catalog:
  # Language / tooling
  typescript: ^5.9.2
  tsx: ^4.20.3
  '@types/node': ^26.0.0

  # Validation (zod v4 — required by @hono/zod-openapi v1)
  zod: ^4.4.3
  '@t3-oss/env-nextjs': ^0.13.8

  # Hono stack
  hono: ^4.12.27
  '@hono/node-server': ^2.0.5
  '@hono/zod-openapi': ^1.4.0
  '@scalar/hono-api-reference': ^0.10.20

  # Auth
  better-auth: ^1.6.22

  # Data layer
  drizzle-orm: ^0.45.2
  drizzle-kit: ^0.31.10
  pg: ^8.22.0
  '@types/pg': ^8.11.10

  # Queue
  bullmq: ^5.78.0
  ioredis: ^5.11.0

  # Storage (Cloudflare R2 via S3 API) + image processing
  '@aws-sdk/client-s3': ^3.700.0
  '@aws-sdk/s3-request-presigner': ^3.700.0
  sharp: ^0.35.3

  # Search
  '@babel/runtime': ^7.29.0
  typesense: ^3.0.6

  # Frontend
  next: ^16.2.11
  react: ^19.0.0
  react-dom: ^19.0.0
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.0.0
  '@radix-ui/react-slot': ^1.3.2
  '@radix-ui/react-avatar': ^1.2.0
  '@radix-ui/react-checkbox': ^1.3.3
  '@radix-ui/react-dialog': ^1.1.15
  '@radix-ui/react-dropdown-menu': ^2.1.18
  '@radix-ui/react-label': ^2.1.10
  '@radix-ui/react-separator': ^1.1.11
  '@radix-ui/react-switch': ^1.2.6
  '@radix-ui/react-tabs': ^1.1.13
  '@radix-ui/react-tooltip': ^1.2.8
  next-themes: ^0.4.6
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  lucide-react: ^1.24.0
  '@dicebear/core': ^10.3.0
  '@dicebear/styles': ^10.2.0
  libphonenumber-js: 1.13.9
  shadcn: ^4.12.0
  tailwind-merge: ^3.3.1
  tw-animate-css: ^1.4.0

  # Testing
  vitest: ^4.1.8
  '@vitest/coverage-v8': ^4.1.8
  '@testing-library/react': ^16.3.2
  '@testing-library/user-event': ^14.6.1
  '@testing-library/jest-dom': ^6.9.1
  happy-dom: ^20.10.6
  '@vitejs/plugin-react': ^6.0.2
  '@playwright/test': ^1.60.0
