packages:
  - 'apps/*'
  - 'packages/*'
  - 'e2e'

# pnpm 10.9+ reads `overrides` / `onlyBuiltDependencies` from here, not the
# package.json `pnpm` field (which newer pnpm silently ignores).
overrides:
  esbuild: 0.28.1
  hono: ^4.13.9
  # Keep Vite's peer graph on one Node type instance. Floating peer resolution
  # produced parallel Vite trees (26.0.0 and 26.4.0) and broke CI typechecking.
  '@types/node': 26.6.1
  # Security patches for transitive advisories (pnpm audit, high severity).
  # brace-expansion DoS advisories through 5.0.10. One line for every copy —
  # eslint's minimatch@3 works fine on 5.x, so the split pins are no longer needed.
  brace-expansion: 5.0.12
  # js-yaml CPU exhaustion, including empty merge sources (GHSA-2883-xcg3-v3hh).
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  # nanoid generator loop advisories: patch each installed major independently.
  # GHSA-2v37-7h3g-55p8 widened the affected 3.x range to <3.3.18, which left the
  # previous `<3.3.17: 3.3.17` pin resolving to an affected version itself.
  'nanoid@>=3.0.0 <3.3.18': 3.3.18
  'nanoid@>=4.0.0 <5.1.16': 5.1.16
  # Transitive CLI dependencies used by shadcn; pin the patched releases.
  browserslist: 4.28.7
  'fast-uri@<3.1.7': 3.1.7
  # MCP HTTP/cache parsing and rate-limit address validation advisories.
  undici: 7.29.1
  ip-address: 10.3.1
  # Typesense HTTP client: patch Axios HTTP/2, ReDoS, and prototype gadgets.
  'axios@>=1.0.0 <1.20.0': 1.20.0
  # sharp (GHSA-f88m-g3jw-g9cj): patch every copy, incl. next's bundled sharp.
  sharp: ^0.35.4
  # postcss sourceMappingURL file disclosure (GHSA-6g55-p6wh-862q <=8.5.11,
  # GHSA-r28c-9q8g-f849 <=8.5.17): patch every copy, via next and via tsup.
  postcss: ^8.5.18

onlyBuiltDependencies:
  - msw
  - sharp

