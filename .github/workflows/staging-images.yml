name: Staging images
on:
  pull_request:
    paths:
      - 'infra/staging/**'
      - 'infra/local/**'
      - 'docker-compose.yml'
      - 'apps/api/src/modules/health/**'
      - 'apps/web/app/health/**'
      - '**/Dockerfile'
      - '.dockerignore'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'apps/api/package.json'
      - 'apps/api/tsup.config.ts'
      - 'apps/worker/package.json'
      - 'apps/worker/tsup.config.ts'
      - 'apps/web/package.json'
      - 'apps/web/next.config.ts'
      - 'apps/worker/src/staging*/**'
      - 'apps/worker/src/staging-prepare.ts'
      - 'packages/config/**'
      - 'packages/logger/**'
      - 'packages/telemetry/**'
      - 'packages/contracts/src/telemetry.ts'
      - 'apps/api/src/telemetry.ts'
      - 'apps/api/src/lib/request-telemetry.ts'
      - 'apps/api/src/modules/telemetry/**'
      - 'apps/api/tests/scripts/telemetry-artifact-smoke.mjs'
      - 'apps/worker/src/observability/**'
      - 'apps/worker/src/index.ts'
      - 'apps/worker/src/runtime.ts'
      - 'apps/worker/src/telemetry.ts'
      - 'apps/worker/scripts/telemetry-smoke.mjs'
      - 'packages/queue/**'
      - 'apps/web/instrumentation*'
      - 'apps/web/src/env.instrumentation.ts'
      - 'apps/web/src/lib/logger*'
      - 'infra/observability/**'
      - '.github/workflows/staging-images.yml'
      - '.github/workflows/staging-deploy.yml'
concurrency:
  group: staging-images-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  signoz-definitions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.14.6'
          terraform_wrapper: false
      - name: Validate SigNoz definitions without workspace credentials
        run: |
          terraform -chdir=infra/observability/signoz init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/observability/signoz fmt -check
          terraform -chdir=infra/observability/signoz validate
  images-and-swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - name: Validate scripts and failure gate
        run: |
          for script in infra/staging/scripts/*.sh; do bash -n "$script"; done
          bash infra/staging/scripts/test-deploy-preflight.sh
          bash infra/staging/scripts/test-release-lock.sh
          python3 infra/staging/scripts/test-storage.py
          bash infra/staging/scripts/test-storage-migration.sh
          bash infra/staging/scripts/test-restore-gate.sh
          bash infra/staging/scripts/test-observability.sh
          bash infra/staging/scripts/test-observability-preflight.sh
          bash infra/local/observability/test-collector.sh
      - name: Build all release images without runtime secrets
        env:
          REGISTRY: localhost:5000/tickif
          STAGING_DOMAIN: staging.example.com
        run: |
          printf '%s\n' 'BUILD_CONTEXT_SECRET=synthetic-must-not-enter-images' > .env.production
          printf '%s\n' 'BUILD_CONTEXT_SECRET=synthetic-nested-secret' > apps/web/.env.local
          mkdir -p .secrets
          printf '%s\n' 'synthetic-ingestion-must-not-enter-images' > .secrets/signoz_ingestion_key
          bash infra/staging/scripts/build.sh
          revision=$(git rev-parse HEAD)
          for service in api worker web operations; do
            docker run --rm --entrypoint sh "localhost:5000/tickif/$service:$revision" \
              -c 'test ! -e /app/.env.production && test ! -e /app/apps/web/.env.local && test ! -e /app/.secrets/signoz_ingestion_key'
          done
          docker run --rm --entrypoint bash "localhost:5000/tickif/operations:$revision" -ec '
            pnpm --filter @repo/worker exec tsx --version
            pnpm --filter @repo/db exec drizzle-kit --version
            test -f apps/worker/src/staging-prepare.ts
            test -f packages/db/src/seeds/index.ts
            test -f infra/staging/scripts/release-job.sh
            test -f infra/staging/scripts/backup-job.sh
            pg_dump --version
            pg_restore --version
            createdb --version
            psql --version
            age --version
            rclone --version
          '
      - name: Test release on the disposable runner Swarm
        run: bash infra/staging/scripts/test-swarm.sh
      - name: Service diagnostics
        if: failure()
        run: |
          docker service ls || true
          docker service ps staging-key-fixture --no-trunc || true
          docker service logs staging-key-fixture --tail 50 || true
          docker service ps tickif_typesense --no-trunc || true
          docker service logs tickif_typesense --tail 50 || true
          docker service ps tickif_prepare --no-trunc || true
          docker service logs tickif_prepare --tail 100 || true
          docker service logs tickif_worker --tail 50 || true
          docker service logs tickif_api --tail 50 || true
          docker service logs tickif_socket-proxy --tail 50 || true
          docker service logs tickif_traefik --tail 50 || true
      - name: Remove disposable runner stack
        if: always()
        run: docker stack rm tickif || true
