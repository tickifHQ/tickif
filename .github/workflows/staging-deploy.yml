name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA whose images should be redeployed
        required: true
        type: string

concurrency:
  group: staging-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Resolve release SHA
        id: release
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
          BUILT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          sha="${REQUESTED_SHA:-$BUILT_SHA}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "A full commit SHA is required" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout release infrastructure
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.sha }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload release bundle
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          tar -czf "/tmp/tickif-${RELEASE_SHA}.tar.gz" infra/staging
          scp "/tmp/tickif-${RELEASE_SHA}.tar.gz" "${STAGING_SSH_USER}@${STAGING_SSH_HOST}:/tmp/"

      - name: Deploy migration-first release
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          IMAGE_REPOSITORY: ${{ github.repository }}
        run: |
          ssh "${STAGING_SSH_USER}@${STAGING_SSH_HOST}" bash -s -- \
            "$RELEASE_SHA" "$IMAGE_REPOSITORY" <<'REMOTE'
          set -Eeuo pipefail
          sha="$1"
          repository="${2,,}"
          release_dir="/opt/tickif/releases/$sha"
          runtime_env="$(mktemp /tmp/tickif-staging.XXXXXX)"
          trap 'rm -f -- "$runtime_env"' EXIT
          install -d -m 750 "$release_dir"
          tar -xzf "/tmp/tickif-${sha}.tar.gz" -C "$release_dir"
          rm -f "/tmp/tickif-${sha}.tar.gz"
          cp /opt/tickif/staging.env "$runtime_env"
          cat >>"$runtime_env" <<EOF
          API_IMAGE=ghcr.io/${repository}-api:${sha}
          WEB_IMAGE=ghcr.io/${repository}-web:${sha}
          WORKER_IMAGE=ghcr.io/${repository}-worker:${sha}
          OPERATIONS_IMAGE=ghcr.io/${repository}-operations:${sha}
          GITHUB_SHA=${sha}
          EOF
          chmod 600 "$runtime_env"
          chmod +x "$release_dir"/infra/staging/scripts/*.sh
          bash "$release_dir/infra/staging/scripts/deploy.sh" "$runtime_env"
          REMOTE
