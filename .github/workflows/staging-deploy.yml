name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA whose images should be redeployed
        required: true
        type: string

concurrency:
  group: staging-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Resolve release SHA
        id: release
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
          BUILT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          sha="${REQUESTED_SHA:-$BUILT_SHA}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "A full commit SHA is required" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout release infrastructure
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0

      - name: Require a release from main
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || {
            echo "Staging only accepts commits reachable from main" >&2
            exit 1
          }

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload release bundle
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          tar -czf "/tmp/tickif-${RELEASE_SHA}.tar.gz" infra/staging
          scp "/tmp/tickif-${RELEASE_SHA}.tar.gz" "${STAGING_SSH_USER}@${STAGING_SSH_HOST}:/tmp/"

      - name: Deploy migration-first release
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          IMAGE_REPOSITORY: ${{ github.repository }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          # SSH joins remote arguments into a shell command. Only these safe
          # identifier alphabets may reach that command; the token uses stdin.
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          username_pattern='^[A-Za-z0-9_-]+(\[bot\])?$'
          [[ "$GHCR_USERNAME" =~ $username_pattern ]]
          remote_script="/tmp/tickif-deploy-${RELEASE_SHA}.sh"
          cat > "$RUNNER_TEMP/deploy-staging.sh" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          sha="$1"
          repository="${2,,}"
          registry_user="$3"
          release_dir="/opt/tickif/releases/$sha"
          runtime_env=''
          export DOCKER_CONFIG=''
          cleanup() {
            [[ -z "$runtime_env" ]] || rm -f -- "$runtime_env"
            [[ -z "$DOCKER_CONFIG" ]] || rm -rf -- "$DOCKER_CONFIG"
            rm -f -- "$0"
          }
          trap cleanup EXIT
          DOCKER_CONFIG="$(mktemp -d /tmp/tickif-docker.XXXXXX)"
          # Fresh, job-scoped read access; never use or overwrite the host login.
          docker login ghcr.io --username "$registry_user" --password-stdin
          runtime_env="$(mktemp /tmp/tickif-staging.XXXXXX)"
          install -d -m 750 "$release_dir"
          tar -xzf "/tmp/tickif-${sha}.tar.gz" -C "$release_dir"
          rm -f "/tmp/tickif-${sha}.tar.gz"
          cp /opt/tickif/staging.env "$runtime_env"
          cat >>"$runtime_env" <<EOF
          API_IMAGE=ghcr.io/${repository}-api:${sha}
          WEB_IMAGE=ghcr.io/${repository}-web:${sha}
          WORKER_IMAGE=ghcr.io/${repository}-worker:${sha}
          OPERATIONS_IMAGE=ghcr.io/${repository}-operations:${sha}
          GITHUB_SHA=${sha}
          EOF
          chmod 600 "$runtime_env"
          chmod +x "$release_dir"/infra/staging/scripts/*.sh
          bash "$release_dir/infra/staging/scripts/deploy.sh" "$runtime_env"
          REMOTE
          scp "$RUNNER_TEMP/deploy-staging.sh" "${STAGING_SSH_USER}@${STAGING_SSH_HOST}:${remote_script}"
          printf '%s\n' "$GHCR_TOKEN" | ssh "${STAGING_SSH_USER}@${STAGING_SSH_HOST}" \
            "bash '$remote_script' '$RELEASE_SHA' '$IMAGE_REPOSITORY' '$GHCR_USERNAME'"
