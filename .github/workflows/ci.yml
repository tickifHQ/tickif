name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: security / audit / codeql
    runs-on: ubuntu-latest
    # CodeQL's analyze step uploads SARIF; without security-events:write it fails with
    # "Resource not accessible by integration". actions:read is needed on private repos.
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        # SARIF upload needs GitHub Advanced Security, which this private repo doesn't have.
        # Keep the scan running but non-blocking; drop this once GHAS is enabled.
        continue-on-error: true

  ci:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Job-level env satisfies BOTH consumers:
    #  - `pnpm db:migrate` / `db:generate` run via `pnpm --filter` (outside Turbo,
    #    so they read raw shell env). They import @repo/config, which fails fast
    #    without BETTER_AUTH_SECRET/BETTER_AUTH_URL and builds DATABASE_URL from
    #    the POSTGRES_* parts (-> the `tickif` database).
    #  - `pnpm test` / `pnpm build` run through Turbo, which strips any env var not
    #    listed in turbo.json `globalEnv`. DATABASE_URL_TEST and BETTER_AUTH_* are
    #    in globalEnv, so they reach the integration tests; POSTGRES_* need not be.
    env:
      # Both `tsc --noEmit` and `next build` type-check the whole web app graph:
      # the full contracts barrel plus the hc<AppType> client type spanning every
      # mounted route. V8 sizes its default heap from system memory, so a dev box
      # has headroom while this ~7 GB runner caps near 2 GB and dies with exit 134.
      # Job-wide because typecheck and build each hit it independently.
      NODE_OPTIONS: --max-old-space-size=4096
      NODE_ENV: test
      BETTER_AUTH_SECRET: ci-dummy-secret-0123456789
      BETTER_AUTH_URL: http://localhost:3001
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: tickif
      POSTGRES_PASSWORD: tickif
      POSTGRES_DB: tickif
      DATABASE_URL_TEST: postgresql://tickif:tickif@localhost:5432/tickif_test
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      TYPESENSE_HOST: http://localhost:8108
      TYPESENSE_API_KEY: ci-typesense-api-key
      # The CI Typesense instance is bootstrapped with only the admin key below, so a distinct
      # value here would 401 the moment a test exercises searchClient(). Scoped-key separation
      # is a production concern — see docs/runbooks/search.md.
      TYPESENSE_SEARCH_API_KEY: ci-typesense-api-key
      TYPESENSE_COLLECTION_PREFIX: tickif_ci
      R2_ENDPOINT: http://localhost:9000
      R2_ACCESS_KEY_ID: minioadmin
      R2_SECRET_ACCESS_KEY: minioadmin
      R2_BUCKET: test-bucket
      TURBO_TELEMETRY_DISABLED: '1'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tickif
          POSTGRES_PASSWORD: tickif
          POSTGRES_DB: tickif
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tickif"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      typesense:
        image: typesense/typesense:30.2
        env:
          TYPESENSE_DATA_DIR: /tmp
          TYPESENSE_API_KEY: ci-typesense-api-key
        ports:
          - 8108:8108

      minio:
        # Bitnami relocated their public images to the bitnamilegacy org; bitnami/minio:latest
        # no longer resolves. This image keeps MINIO_DEFAULT_BUCKETS auto-creation + server entrypoint.
        image: bitnamilegacy/minio:latest
        env:
          MINIO_DEFAULT_BUCKETS: test-bucket
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm must be installed BEFORE setup-node, otherwise `cache: pnpm` fails
      # (it shells out to pnpm to locate the store path).
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache Turbo's local task cache across runs for faster typecheck/build/test.
      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # The postgres service only creates POSTGRES_DB (=tickif). Integration tests
      # target separate databases that must pre-exist (migrateTestDb creates tables,
      # not the database): tickif_test for the api, tickif_worker_test for the worker
      # so the two suites never truncate each other when turbo runs them in parallel.
      - name: Create test databases
        run: |
          PGPASSWORD=tickif psql -h localhost -p 5432 -U tickif -d tickif \
            -c "CREATE DATABASE tickif_test;" \
            -c "CREATE DATABASE tickif_worker_test;"

      - name: Wait for Typesense
        run: curl --retry 20 --retry-all-errors --retry-delay 1 --fail http://localhost:8108/health

      # Create the checked-in resources once, then prove a second pass is a no-op.
      - name: Bootstrap search collections
        run: |
          pnpm --filter @repo/search bootstrap
          pnpm --filter @repo/search bootstrap -- --check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Migration gating (blueprint §9): migrate the empty `tickif` DB, then
      # regenerate SQL from the schema and fail if the committed migrations drift
      # from the schema.
      - name: Apply migrations
        run: pnpm db:migrate

      - name: Check migration drift
        run: |
          pnpm db:generate
          # --intent-to-add makes any brand-new (untracked) generated migration
          # files visible to `git diff`, so drift that emits only new files
          # (e.g. a new 0001_*.sql / meta snapshot) still fails the gate.
          git add --intent-to-add packages/db/migrations
          git diff --exit-code packages/db/migrations

  publish-images:
    name: publish / ${{ matrix.name }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: worker
            dockerfile: apps/worker/Dockerfile
          - name: operations
            dockerfile: infra/staging/Dockerfile.operations
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate staging build-time URL
        env:
          STAGING_HOST: ${{ vars.STAGING_HOST }}
        run: test -n "$STAGING_HOST"

      - name: Resolve lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push immutable image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ vars.STAGING_HOST }}
            NEXT_PUBLIC_WEB_URL=https://${{ vars.STAGING_HOST }}
            NEXT_PUBLIC_SCROLL_GATE_LIMIT=${{ vars.STAGING_SCROLL_GATE_LIMIT || '5' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true
